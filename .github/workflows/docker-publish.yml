name: Test and publish image

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: swilli23/pixel2mqtt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Byte-compile everything
        run: python -m compileall -q pixel2mqtt tests
      - name: Offline tests (converters, formats, topic rewriting)
        run: python tests/test_offline.py
      - name: Web editor syntax check
        run: for f in pixel2mqtt/static/*.js; do node --check "$f"; done
      - name: Scene model / renderer tests
        run: node tests/test_scene.js

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest = the newest release (a v* tag without "-", so betas don't move it); edge = the main branch;
          # beta = the most recently pushed feat/* branch (experimental)
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/heads/feat/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          printf 'Docker image: `swilli23/pixel2mqtt:%s` (also `:latest`), for amd64 and arm64.\n\nSee the README for the compose file and setup. Needs a display running [pixeld-h6631](https://github.com/JinjAdmin/pixeld-h6631).\n' "$V" > notes.md
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes $PRE
